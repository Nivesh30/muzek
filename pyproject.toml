[project]
name = "muzek"
version = "0.1.0"
description = "Breaks songs into rhythmic, harmonic, structural, and timbral patterns and maps each to color."
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.10",
    "numpy>=1.24",
    "scipy>=1.11",
    "click>=8.1",
    "soundfile>=0.12",
    "flask>=3.0",
]

[project.scripts]
muzek = "muzek.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["muzek*"]
